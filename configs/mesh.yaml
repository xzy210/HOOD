# Mesh mode training configuration
# Inherits common settings from _base.yaml
#
# Supports two modes:
# 1. Single sequence: specify body_sequence_path and cloth_sequence_path
# 2. Multi-sequence: specify data_root and split_path (CSV datasplit file)

defaults:
  - _base

experiment:
  name: mesh_training
  checkpoint_path: 'hood_data/experiments/20251203_120152/checkpoints/step_0000060000.pth'
  save_checkpoint_every: 2000
  n_epochs: 100000
  max_iter: 70000

step_start: 60000

dataloader:
  num_workers: 0
  batch_size: 1
  dataset:
    mesh:
      # ============================================
      # Option 1: Single sequence mode
      # ============================================
      body_sequence_path: 'hood_data/EcoData/split_output/body_skinned_mesh_flipped.pkl'
      cloth_sequence_path: 'hood_data/EcoData/split_output/surface_LayeredClothing_A0F407.pkl'
      cloth_template_path: 'hood_data/EcoData/split_output/surface_LayeredClothing_A0F407_ref.pkl'
      
      # ============================================
      # Option 2: Multi-sequence mode (uncomment to use)
      # ============================================
      # data_root: 'vto_dataset_mesh'  # relative to $HOOD_DATA
      # split_path: 'datasplits/mesh_train.csv'  # relative to $HOOD_DATA/aux_data
      # garment_dict_file: 'garment_meshes.pkl'  # optional, relative to $HOOD_DATA/aux_data
      
      # ============================================
      # Common settings
      # ============================================
      n_coarse_levels: 3
      lookup_steps: 5
      noise_scale: 3e-3  # Position noise for data augmentation
      pinned_verts: true  # Whether to use pinned vertices
      wholeseq: false  # Set to true for validation mode

# ============================================
# Datasplit CSV format example (for multi-sequence mode):
# ============================================
# id,garment,length
# tshirt_shape00_01_01,tshirt,300
# tshirt_shape00_01_02,tshirt,250
# dress_shape01_02_01,dress,400
#
# Where:
# - id: sequence identifier (used to construct file paths)
# - garment: garment name (used for template lookup and path construction)
# - length: number of frames in sequence
#
# File paths are constructed as:
# - Body: {data_root}/body_sequence/{id}.pkl
# - Cloth: {data_root}/{garment}_sequence/{id}.pkl
