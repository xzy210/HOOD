# Configuration file for training HOOD with Mesh format animation sequences

experiment:
  name: mesh_training
  output_dir: 'Tests/checkpoints'              # Output directory in Tests folder
  save_checkpoint_every: 2000
  n_epochs: 100000
  checkpoint_path: null                        # Set path to resume from checkpoint

runner:
  from_any_pose:
    material:
      lame_mu_min: 15909
      lame_mu_max: 63636
      lame_lambda_min: 3535.414406069427
      lame_lambda_max: 93333.73508005822
      bending_coeff_min: 6.370782056371576e-08
      bending_coeff_max: 0.0013139737991266374
      density_min: 4.34e-2
      density_max: 7e-1

dataloader:
  num_workers: 0                              # Set to 0 to avoid multiprocessing issues
  batch_size: 1
  pyg_data: True
  dataset:
    from_any_pose:
      # SMPL model is not needed for mesh format, but required by the codebase
      smpl_model: 'smpl/SMPL_FEMALE.pkl'
      
      # IMPORTANT: Set to 'mesh' for mesh format input
      pose_sequence_type: "mesh"
      
      # Path to your mesh sequence .pkl file (relative to project root or absolute)
      # Format: {'verts': [N, V, 3], 'faces': [F, 3]}
      pose_sequence_path: 'Tests/data/sphere_sequence.pkl'
      
      # Path to garment template .pkl file (relative to project root or absolute)
      # Note: Also supports .obj format - the system will auto-detect and convert
      garment_template_path: 'Tests/data/square_cloth.obj'
      
      # ============ Dual Mesh Sequence Mode (Body + Tshirt) ============
      # When using dual mode, set these paths instead of pose_sequence_path
      # Body mesh sequence pkl file path
      body_sequence_path: 'Tests/data/vto_dataset_mesh/body_sequence/tshirt_shape00_01_01.pkl'
      # Tshirt mesh sequence pkl file path
      tshirt_sequence_path: 'Tests/data/vto_dataset_mesh/tshirt_sequence/tshirt_shape00_01_01.pkl'
      # Static tshirt obj file path (for rest_pos)
      tshirt_template_path: 'Tests/data/tshirt.obj'
      
      # Optional: path to obstacle auxiliary data file
      # obstacle_dict_file: 'Tests/obstacle_aux.pkl'
      
      n_coarse_levels: 3
      pinned_verts: true

criterions:
  postcvpr.mataug.stretching_energy:
  postcvpr.inertia:
  postcvpr.gravitational_energy:
    z_axis: 1
  postcvpr.collision_penalty:
    weight_start: 5e+3
    weight_max: 5e+5
    eps: 2e-3
    start_rampup_iteration: 50000
    n_rampup_iterations: 100000
  postcvpr.mataug.bending_energy:
  postcvpr.friction_energy:
    mu: 0.5
    friction_radius: 3e-3

model:
  postcvpr:
    core_model: 'postcvpr'
    architecture: "f,c0|f,c0|f,c0|d:c0,c1|c0,c1|c0,c1|d:c1|c1|c1|u:c0,c1|c0,c1|c0,c1|u:f,c0|f,c0|f,c0"
    collision_radius: 3e-2
    k_world_edges: 1
    n_coarse_levels: 3

device: 'cuda:0'
detect_anomaly: false
