# Configuration file for training HOOD with Mesh format animation sequences

experiment:
  name: mesh_training
  output_dir: 'Tests/checkpoints'              # Output directory in Tests folder
  save_checkpoint_every: 2000
  n_epochs: 100000
  checkpoint_path: null                        # Set path to resume from checkpoint

runner:
  from_any_pose:
    # Training parameters
    warmup_steps: 100                         # Number of steps to warm up the normalization statistics
    increase_roll_every: 5000                 # Increase roll steps every N iterations
    roll_max: 5                               # Maximum number of autoregressive steps
    push_eps: 2e-3                            # Collision solver threshold
    grad_clip: 1.0                            # Gradient clipping norm
    overwrite_pos_every_step: false           # Whether to overwrite canonical poses
    initial_ts: 0.333333                      # Time step for first frame (1/3)
    regular_ts: 0.033333                      # Regular time step (1/30)
    
    # Optimizer config
    optimizer:
      lr: 1e-4                        # initial learning rate
      decay_rate: 0.1                 # decay multiplier for the scheduler
      decay_min: 0                    # minimal decay
      decay_steps: 5000000            # number of steps for one decay step
      step_start: 0                   # step to start from (used to resume training)
    
    # Material parameters
    material:
      lame_mu_min: 15909
      lame_mu_max: 63636
      lame_lambda_min: 3535.414406069427
      lame_lambda_max: 93333.73508005822
      bending_coeff_min: 6.370782056371576e-08
      bending_coeff_max: 0.0013139737991266374
      density_min: 4.34e-2
      density_max: 7e-1
      bending_multiplier: 1.0

      density_override: null    # 该设置成null还是none?????
      lame_mu_override: null
      lame_lambda_override: null
      bending_coeff_override: null

dataloader:
  num_workers: 0                              # Set to 0 to avoid multiprocessing issues
  batch_size: 1
  pyg_data: True
  dataset:
    from_any_pose:      
      # ============ Dual Mesh Sequence Mode (Body + Tshirt) ============
      # Body mesh sequence pkl file path
      body_sequence_path: 'Tests/data/vto_dataset_mesh/body_sequence/tshirt_shape00_01_01.pkl'
      # Tshirt mesh sequence pkl file path
      tshirt_sequence_path: 'Tests/data/vto_dataset_mesh/tshirt_sequence/tshirt_shape00_01_01.pkl'
      # Static tshirt obj file path (for rest_pos)
      tshirt_template_path: 'Tests/data/tshirt.obj'
      
      n_coarse_levels: 3
      pinned_verts: true

criterions:
  postcvpr.mataug.stretching_energy:
  postcvpr.inertia:
  postcvpr.gravitational_energy:
    z_axis: 1
  postcvpr.collision_penalty:
    weight_start: 5e+3
    weight_max: 5e+5
    eps: 2e-3
    start_rampup_iteration: 50000
    n_rampup_iterations: 100000
  postcvpr.mataug.bending_energy:
  postcvpr.friction_energy:
    mu: 0.5
    friction_radius: 3e-3

model:
  postcvpr:
    core_model: 'postcvpr'
    architecture: "f,c0|f,c0|f,c0|d:c0,c1|c0,c1|c0,c1|d:c1|c1|c1|u:c0,c1|c0,c1|c0,c1|u:f,c0|f,c0|f,c0"
    collision_radius: 3e-2
    k_world_edges: 1
    n_coarse_levels: 3

device: 'cuda:0'
detect_anomaly: false
